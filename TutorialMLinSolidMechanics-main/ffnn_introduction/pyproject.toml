[project]
name = "tmlsm"
version = "0.1.0"
description = "Tutorial Machine Learning in Solid Mechanics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.7.2",
    "jaxlib>=0.7.2",
    "klax==0.1.3",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
